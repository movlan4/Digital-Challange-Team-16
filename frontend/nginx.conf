server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Server-Sent Events: disable buffering so updates reach the browser immediately
    location = /api/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger UI / OpenAPI schema from FastAPI
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
    }

    location / {
        add_header Cache-Control "no-cache";  # revalidate (ETag) so new releases are never served stale
        try_files $uri $uri/ =404;
    }
}
